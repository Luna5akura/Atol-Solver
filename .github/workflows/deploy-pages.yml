name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        run: nix-shell --run 'cd pzprjs && pnpm install --frozen-lockfile'

      - name: Build solver backend
        run: nix-shell --run 'cd cspuz_core && bash ./build_cspuz_solver_backend.sh release'

      - name: Copy wasm artifacts into frontend dist
        run: |
          mkdir -p pzprjs/dist/wasm
          cp -r cspuz_core/build/cspuz_solver_backend/* pzprjs/dist/wasm/

      - name: Build frontend
        run: nix-shell --run 'cd pzprjs && pnpm build'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pzprjs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
